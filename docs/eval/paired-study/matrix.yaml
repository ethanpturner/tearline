# The paired-study truth set: which of a code reviewer and tearline is expected to catch each
# fault, authored before any model reviewer runs (DEC-009). `expected_caught_by` is one of
# reviewer, tearline, both, neither. Edited afterwards only on an argument from the inputs, never
# from a result.
#
# The ragref rows are the truth ragref carried as `truth/matrix.yaml` at af01df1, moved here
# verbatim; ragref now points at this file. The rag_api rows were written from the pull request's
# own description of what it closed (#319, merged 2026-08-15), after tearline had run against the
# pre-fix and post-fix commits (docs/eval/real-targets.md) and before any model reviewer had.
# That order is stated because it is not the ragref order.
#
# Two properties of the verifier's live path bound what "tearline" can mean below:
#   - On the application-enforced store (Qdrant) the differential axis issues the verifier's own
#     filtered search, so a fault in the application's retrieval code is invisible to it; only
#     faults in the stored data reach the probes.
#   - On both stores the live path communicates the tenant and not the roles, so truth computed
#     from the full rule can diverge from what the engine returns for a principal without `member`.
#     Every probing principal in ragref holds `member` for that reason (issue #5).
rows:
  - id: ragref/f-parent-dir
    target: ragref
    branch_or_commit: f-parent-dir
    fault: tenant derived from the top-level directory name instead of the owning group
    tearline_scenario: wrong-tenant-tag
    expected_caught_by: both
    reasoning: >
      A reviewer reading the ingester can see a directory name standing in for an ACL. tearline
      sees the tag disagree with the source on every chunk of the misplaced document, and the
      probes show the globex principal missing it and the acme principal receiving it.
  - id: ragref/f-exclusion
    target: ragref
    branch_or_commit: f-exclusion
    fault: policy admits any chunk whose stated tenants do not exclude the caller; with an untagged
      chunk present, the untagged chunk is admitted to everyone
    tearline_scenario: untagged-chunk/faulted-naive
    expected_caught_by: both
    reasoning: >
      An exclusion-shaped authorization predicate is a recognisable defect in code. tearline
      reports the propagation fault on the untagged chunks and, on the engine-enforced store,
      over-retrieval for every principal. On Qdrant the verifier's own filter is used, so only the
      propagation finding appears there.
  - id: ragref/f-untagged
    target: ragref
    branch_or_commit: f-untagged
    fault: documents two directories deep are written with no entitlement; the policy is correct
    tearline_scenario: untagged-chunk/faulted
    expected_caught_by: tearline
    reasoning: >
      Nothing leaks, so a reviewer looking for disclosure has nothing to report; the bug is a depth
      condition in the ingester that reads as a filter. tearline reports the propagation fault and
      under-retrieval for the entitled acme principals.
  - id: ragref/f-limit-first
    target: ragref
    branch_or_commit: f-limit-first
    fault: an approximate index with a small candidate bound, entitlement filtering after the scan
    tearline_scenario: post-filter-truncation
    expected_caught_by: tearline
    reasoning: >
      No disclosure occurs and the configuration is a performance setting; a reviewer's critic is
      expected to dismiss it. tearline reports under-retrieval on the engine-enforced store.
  - id: ragref/f-chmod
    target: ragref
    branch_or_commit: f-chmod
    fault: no code change; two ACLs are narrowed after ingestion
    tearline_scenario: narrowed-after-ingest
    expected_caught_by: tearline
    reasoning: >
      There is no code for a reviewer to read. tearline reports the tag disagreeing with the source
      with cause drift, because the source's ACL time is later than the chunk's ingestion time.
  - id: ragref/f-superuser
    target: ragref
    branch_or_commit: f-superuser
    fault: the application connects as a superuser, so the row-level security policy never applies
    tearline_scenario: none
    expected_caught_by: reviewer
    reasoning: >
      A connection string naming a superuser is visible in configuration. Pointed at the same
      connection, tearline refuses to run rather than reporting a clean boundary it never tested;
      that is an error, not a finding.
  - id: ragref/f-merge
    target: ragref
    branch_or_commit: f-merge
    fault: the chunker joins a short document tail onto the next document's head across a tenant
      boundary, and tags the result with the first document's entitlement
    tearline_scenario: boundary-crossing-chunk
    expected_caught_by: tearline
    reasoning: >
      The merge is a chunking heuristic that reads as an optimisation. tearline sees a chunk with
      two source documents whose entitlements diverge, and reports it as exceeding the safe bound
      when the tag grants beyond what every source permits.
  - id: ragref/f-policy-intent
    target: ragref
    branch_or_commit: f-policy-intent
    fault: the documented intent requires the `audit` role for `acme/audit/`; the source ACL and the
      policy both admit every acme member
    tearline_scenario: none (evaluation plan section 7)
    expected_caught_by: neither
    reasoning: >
      The source system's ACL is ground truth for tearline, and it agrees with the index, so there
      is no finding by decision. A reviewer may raise it as a design note if it reads the README,
      but nothing in the code contradicts the code.
  - id: rag_api/ids-listing
    target: rag_api
    branch_or_commit: 4985b37
    fault: GET /ids lists every file identifier in the deployment to any authenticated caller
    tearline_scenario: untagged-chunk/faulted-naive (nearest; the store holds every owner's chunks under one predicate)
    expected_caught_by: both
    reasoning: >
      A route that lists a store with no owner argument is visible in code. tearline's differential
      probe calls the same route as each principal and receives the other principal's identifiers,
      which is over-retrieval.
  - id: rag_api/query-multiple
    target: rag_api
    branch_or_commit: 4985b37
    fault: POST /query_multiple performs no authorization over the identifiers it is handed
    tearline_scenario: untagged-chunk/faulted-naive (nearest)
    expected_caught_by: both
    reasoning: >
      The route passes caller-supplied identifiers to the store with a filter built from them and
      nothing else; a reviewer can see the missing owner scope, and tearline's probe over every
      identifier returns the other principal's chunks.
  - id: rag_api/query-first-hit
    target: rag_api
    branch_or_commit: 4985b37
    fault: POST /query authorizes the whole result set from its first element and returns the set
    tearline_scenario: none exercised
    expected_caught_by: reviewer
    reasoning: >
      Authorizing a set from its first element is an idiom a reviewer recognises. tearline's probe
      recipe for this target called /ids and /query_multiple, not /query, so the differential axis
      did not exercise this route; a probe that did would be expected to see it.
  - id: rag_api/documents-by-any-id
    target: rag_api
    branch_or_commit: 4985b37
    fault: GET /documents, GET /documents/{id}/context and DELETE /documents read or delete any file identifier
    tearline_scenario: none exercised
    expected_caught_by: reviewer
    reasoning: >
      The read routes are the same missing-scope shape as the listing. The delete route is a write,
      and tearline never issues one (DEC-004), so only a reviewer can report it.
  - id: rag_api/null-owner
    target: rag_api
    branch_or_commit: 4985b37
    fault: a chunk with no recorded user_id reads as belonging to everyone
    tearline_scenario: untagged-chunk/faulted-naive
    expected_caught_by: both
    reasoning: >
      `if owner is None or owner == caller` is a recognisable idiom. tearline reports the chunk's
      stored entitlement as unknown against a stated owner on the propagation axis (DEC-003), and
      the differential axis shows it returned to the other principal before the fix and withheld
      from its owner after.
  - id: rag_api/rollback-by-file-id
    target: rag_api
    branch_or_commit: 4985b37
    fault: the sync-store rollback deletes by file_id with no owner predicate
    tearline_scenario: none
    expected_caught_by: reviewer
    reasoning: >
      An ingestion-path write. Nothing reaches the index until a rollback runs, and tearline
      issues no writes, so only a reviewer reading the ingestion code can report it.
  - id: rag_api/shared-table-collection-id
    target: rag_api
    branch_or_commit: 4985b37
    fault: pgvector lookups on the shared table omit the collection_id predicate
    tearline_scenario: none exercised
    expected_caught_by: reviewer
    reasoning: >
      A missing predicate on a shared table needs knowledge of which table is shared; a reviewer
      that has read the schema has it. The probes here ran within one collection, so the index
      showed nothing.
