name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every uv invocation asserts the lockfile is current instead of silently updating it.
env:
  UV_LOCKED: "1"

jobs:
  ci:
    name: lint / typecheck / test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks scans full history.
          fetch-depth: 0
          # Nothing here pushes; dropping the token keeps a compromised step from writing.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --locked fails if uv.lock is stale, so a dependency edit cannot land without it.
      - name: Install dependencies
        id: install
        run: uv sync --locked --all-groups

      # Each check runs even when an earlier one failed, so one run reports every problem. They
      # are gated on the install rather than on `!cancelled()` alone, because `uv run` would
      # otherwise build its own environment and report green on top of a broken install.
      - name: ruff check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run ruff check --output-format=github .

      - name: ruff format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run ruff format --check --diff .

      - name: mypy
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run mypy

      # The `live` marker is deselected by addopts, so this touches no real vector store or source
      # system and needs no credential.
      - name: pytest
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run pytest -q

      # Checks that a hand-authored expected-visibility.yaml is arithmetically consistent with its
      # own fixture. It tests the SCENARIO rather than the tool, so a failure here means the answer
      # key is wrong -- which is worth distinguishing from the step below.
      - name: scenario expectations are self-consistent
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run python scripts/validate_fixtures.py

      # Every registered variant, scored against its authored expectations. Tests the TOOL against
      # the answer key the previous step just validated.
      - name: verification agrees with the authored expectations
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: uv run tearline evaluate

      # DEC-002 forbids chunk text anywhere in the data model: a report about a confidentiality
      # failure gets pasted into tickets and CI logs, so a report quoting leaked material is itself
      # a leak. The rule is a design property and nothing else enforces it, so a field added in a
      # tidy-up would pass every other check in this workflow.
      - name: no domain object carries chunk content
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          if grep -nE '^\s+(text|content|body|passage|chunk_text)\s*:' src/tearline/domain.py; then
            echo "::error file=src/tearline/domain.py::a content-bearing field was added to the domain model (DEC-002)"
            exit 1
          fi
          echo "domain model carries no content-bearing field"

      # gitleaks is the enforcement point a local hook cannot provide: `--no-verify` or a clone
      # without `pre-commit install` bypasses the hook. `--redact` keeps any hit out of the log.
      - name: gitleaks
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --no-banner --redact

      # `[project.scripts]` claims an entry point; this proves a built wheel exposes it.
      - name: the built wheel exposes the CLI
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          uv build
          uv run --isolated --with dist/*.whl tearline --help

  # The backend adapter is verified here and nowhere else: there is no local Postgres, so this
  # service container is where DEC-017's claims about engine enforcement actually get tested rather
  # than asserted. The suite is deselected by the `live` marker in every other context.
  pgvector:
    name: pgvector + row-level security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: tearline
          POSTGRES_DB: tearline
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        id: install
        run: uv sync --locked --all-extras --all-groups

      # A role that is NOT the table owner. Row-level security is bypassed by the owner unless
      # FORCE is set, and the schema does set it -- but running as a separate role means the test
      # would still be meaningful if that line were ever removed, rather than passing because the
      # connection happened to be privileged.
      - name: create an unprivileged role
        run: |
          PGPASSWORD=tearline psql -h localhost -U postgres -d tearline -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE reader LOGIN PASSWORD 'reader';
          GRANT USAGE ON SCHEMA public TO reader;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO reader;
          SQL

      - name: live backend tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          TEARLINE_PG_DSN: postgresql://postgres:tearline@localhost:5432/tearline
        run: uv run pytest -m live -q

      # A green live suite would be worthless if the marker filter silently selected nothing.
      - name: the live suite actually ran
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          TEARLINE_PG_DSN: postgresql://postgres:tearline@localhost:5432/tearline
        run: |
          uv run pytest -m live -q 2>&1 | tee /tmp/live.txt
          grep -qE '[1-9][0-9]* passed' /tmp/live.txt \
            || { echo "::error::the live suite selected no tests"; exit 1; }
          grep -q 'skipped' /tmp/live.txt \
            && { echo "::error::a live test skipped; the DSN was probably not set"; exit 1; }
          echo "the live backend suite ran against a real PostgreSQL"
