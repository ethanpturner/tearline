name: Release

# Publishes to PyPI when a version tag is pushed. Uses Trusted Publishing (OIDC), so no API token
# is stored in this repository -- the exchange is scoped to this workflow in this repository, and
# there is no long-lived credential to leak or rotate.
#
# **Requires one-time setup on PyPI** before the first tag: add a trusted publisher for the project
# with owner `ethanpturner`, repository `tearline`, workflow `release.yml`, environment `pypi`.
# Until that exists the publish step fails with a permissions error, which is the correct failure --
# it means nothing can publish under this name yet.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # The full gate runs again here rather than trusting the tagged commit's earlier CI. A tag
      # can point at any commit, including one that never passed.
      - name: the gate
        run: |
          uv sync --locked --all-groups
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run pytest -q

      - name: build
        run: uv build

      # The tag must match the version in pyproject.toml. Publishing v0.2.0 from a tree that says
      # 0.1.0 puts a wheel on PyPI whose metadata contradicts the tag it was cut from, and the
      # mismatch is invisible afterwards.
      - name: the tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          built=$(ls dist/*.whl | sed -E 's/.*-([0-9][^-]*)-py3.*/\1/')
          [ "$tag" = "$built" ] \
            || { echo "::error::tag $tag does not match packaged version $built"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write   # the OIDC token exchanged for a short-lived PyPI credential
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
