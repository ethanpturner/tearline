    principal: p-acme-eng
    visible: [c-0032, c-0042]
    over_retrieved: [c-0042]
    under_retrieved: []
    outcome: over-retrieval
    why: >-
      c-0042 comes from doc-004, which requires the `finance` role. The chunk carries no metadata,
      so the naive filter finds nothing to exclude on and admits it.

  - probe: pr-003
    principal: p-globex-eng
    visible: [c-0032, c-0042]
    over_retrieved: [c-0042]
    under_retrieved: []
    outcome: over-retrieval
    why: >-
      The serious one. A restricted finance document reaches a principal in a **different tenant**.
