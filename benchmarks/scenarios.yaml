# The scenario registry. The evaluation harness reads scenarios from this file and never discovers
# them by scanning directories. A registry makes the benchmark set a stated fact rather than a fact
# about the filesystem.
#
# status: planned | recorded | unobserved | live
#   planned    - authored, no fixture built yet
#   recorded   - fixture exists and runs offline
#   unobserved - authored, and the case was searched for and not found in the systems examined
#   live       - requires a real backend; excluded from the default run

version: 0.1
scenarios:
  - slug: wrong-tenant-tag
    name: Chunk carries a tenant its source document does not
    path: benchmarks/wrong-tenant-tag
    status: recorded
    category: propagation
    # One mislabelled chunk, two failure modes: the acme principal receives globex content
    # (over-retrieval) and the globex principal loses its own (under-retrieval). A leak-only tool
    # finds half of this fault and reports the other half as healthy.

  - slug: untagged-chunk
    name: Chunk reaches the index with no entitlement metadata
    path: benchmarks/untagged-chunk
    status: recorded
    category: propagation
    # Three variants, because the same ingestion fault is latent or catastrophic depending on
    # enforcement. Under the stated rule the chunk is withheld from the person entitled to it;
    # under a filter that reads absence as no-restriction it reaches a different tenant entirely.
    # The first tool-visible symptom of the latent case is under-retrieval, which points away from
    # the real problem.

# Intended first scenarios. Each is built from a correct corpus plus one named fault, and runs
# twice -- once where the fault must be found, once against the clean version where nothing must be.
#
# - slug: wrong-tenant-tag
#   measures: the basic propagation fault. A chunk carries a tenant its source document does not.
#
# - slug: untagged-chunk
#   measures: DEC-003. A chunk with no entitlement metadata. The natural filter admits it; the
#             correct output is `unknown` and a finding, never a pass.
#
# - slug: narrowed-after-ingest
#   measures: drift distinguishable from a propagation fault, with timestamps present.
#
# - slug: narrowed-without-timestamps
#   measures: the same drift with timestamps unavailable. Correct output is `entitlement-mismatch`
#             with cause `unverifiable` -- the tool must not guess which of the two it is.
#
# - slug: orphaned-chunk
#   measures: a chunk whose source document cannot be located. `unverifiable`, counted in
#             chunks_untraceable, and never counted as clean.
#
# - slug: post-filter-truncation
#   measures: DEC-008. Correct tags, filtering applied after the ANN scan, so an entitled principal
#             receives nothing. No leak, and still a finding. The scenario a leak-only tool passes.
#
# - slug: boundary-crossing-chunk
#   measures: a chunk spanning a restricted appendix and public body. The source system does not
#             determine the answer; the correct output is `unverifiable`, and this is the case most
#             likely to be abused as a disposal route for inconvenient failures.
#
# - slug: single-principal-probe
#   measures: DEC-007. Only one identity available. The probe does not run and the report says so;
#             "no leak detected" is the forbidden output.

  - slug: boundary-crossing-chunk
    name: Chunk drawn from documents with different audiences
    path: benchmarks/boundary-crossing-chunk
    status: recorded
    category: indeterminate
    # The scenario where the source system does not determine the answer. Chunking created an
    # object the source has never had an opinion about. The tool abstains on whether the safe tag
    # is *correct* and still catches a tag that is unsafe -- so `unverifiable` keeps its teeth and
    # is forbidden in the faulted variant.

  - slug: narrowed-after-ingest
    name: Source ACL changed after the index was built
    path: benchmarks/narrowed-after-ingest
    status: recorded
    category: drift
    # Two drifts in opposite directions in one run: a narrowed source leaves the index permissive
    # (the oversharing pattern -- nothing breached, a permission tightened and the index did not
    # hear), a broadened source leaves it restrictive. Timestamps make the cause determinable.

  - slug: narrowed-without-timestamps
    name: The same drift, with no timestamps to attribute it
    path: benchmarks/narrowed-without-timestamps
    status: recorded
    category: drift
    # Identical divergence, no acl_modified_at or ingested_at. The mismatch stays `contradicted`
    # and the CAUSE becomes `unverifiable`. Verdict and cause are separate axes and a tool must
    # not collapse them -- guessing either way misdirects the fix.
