must_not_conclude:
  - claim: "no leak detected"
    why: >-
      **The forbidden output, and the whole scenario.** pr-009 ran under one identity. Everything it
      returned may legitimately be that principal's own, so nothing about the boundary was tested.
      Reporting a pass is the strongest form of false assurance available, because it is produced by
      a check that appears to have succeeded (DEC-007).
  - claim: "pr-009 passed"
    why: "It did not run."
  - claim: "coverage is complete"
    why: >-
      Half the probe set could not execute. A report that does not surface `probes_skipped` lets a
      reader mistake an unexercised boundary for a tested one.
